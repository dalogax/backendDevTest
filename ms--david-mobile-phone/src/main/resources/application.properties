spring.application.name=msdavidmobilephone
server.port=5000

# External API
external.api.base-url=http://localhost:3001

# Timeouts
spring.mvc.async.request-timeout=5000
server.tomcat.connection-timeout=5000

# Feign Client
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000

# WebFlux Client Configuration
# Connection Pool - aumentado para alta concurrencia
webflux.connection-pool.max-connections=1000
webflux.connection-pool.max-idle-time=20s
webflux.connection-pool.max-life-time=60s
webflux.connection-pool.pending-acquire-timeout=30s
webflux.connection-pool.pending-acquire-max-count=500

# Timeouts
webflux.timeout.connect=3s
webflux.timeout.read=5s
webflux.timeout.write=5s

# Retry Configuration
webflux.retry.max-attempts=2
webflux.retry.backoff=100ms

# Reactor Netty - aumentado para más paralelismo
# ioWorkerCount: número de threads para I/O (default: cores * 2)
reactor.netty.ioWorkerCount=16
# ioSelectCount: número de threads para selectores (default: cores)
reactor.netty.ioSelectCount=4

# Prefer native transport si está disponible (epoll/kqueue)
reactor.netty.transport.native=true

product.repository.impl=webflux
