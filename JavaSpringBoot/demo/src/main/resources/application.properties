spring.application.name=demo
server.port=5000

# External API configuration
external.api.base-url=http://localhost:3001
external.api.timeout.connect=2000
external.api.timeout.read=5000

# Resilience configuration
resilience.circuit-breaker.failure-rate-threshold=50
resilience.circuit-breaker.wait-duration=10000
resilience.retry.max-attempts=3
